<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Liberty City Web Map</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    html, body, canvas { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #071018; color: #e9f2f7; }
    canvas { display: block; }
    .hud { position: fixed; inset: 0; pointer-events: none; }
    .brand { position: absolute; top: 26px; left: 30px; text-transform: uppercase; letter-spacing: .16em; text-shadow: 0 2px 18px #000; }
    .brand strong { display: block; font-size: 20px; letter-spacing: .08em; }
    .brand span { color: #8ba3b4; font-size: 11px; }
    .panel { position: absolute; right: 24px; bottom: 22px; min-width: 280px; padding: 14px 16px; border: 1px solid #ffffff20; background: #071018d9; box-shadow: 0 16px 48px #0008; backdrop-filter: blur(12px); pointer-events: auto; }
    .panel div { display: flex; justify-content: space-between; gap: 24px; padding: 3px 0; font-size: 12px; color: #91a9b8; }
    .panel b { color: #eef7fa; font-weight: 600; }
    .loading { position: absolute; left: 50%; top: 50%; width: min(440px, calc(100vw - 48px)); transform: translate(-50%, -50%); padding: 24px; background: #071018e8; border: 1px solid #ffffff1c; box-shadow: 0 30px 90px #000b; transition: opacity .4s ease; }
    .loading.done { opacity: 0; }
    .loading h1 { margin: 0 0 6px; font-size: 19px; letter-spacing: .08em; text-transform: uppercase; }
    .loading p { margin: 0 0 18px; color: #91a9b8; font-size: 12px; }
    .track { height: 3px; background: #ffffff14; overflow: hidden; }
    .bar { width: 2%; height: 100%; background: #83d9e8; box-shadow: 0 0 16px #83d9e8; transition: width .18s ease; }
    .hint { position: absolute; left: 30px; bottom: 26px; color: #90a6b4; font-size: 11px; letter-spacing: .05em; text-shadow: 0 2px 8px #000; }
    .modes { display: grid !important; grid-template-columns: repeat(3, 1fr); gap: 6px !important; margin-bottom: 10px; }
    button, select { border: 1px solid #ffffff24; background: #ffffff0b; color: #dce8ee; padding: 7px 8px; font: inherit; cursor: pointer; }
    button.active { border-color: #83d9e8; color: #83d9e8; background: #83d9e812; }
    select { width: 100%; margin-bottom: 10px; color-scheme: dark; }
    .sep { margin: 12px 0 6px; padding-top: 10px; border-top: 1px solid #ffffff1c; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: #6f8697; }
    .panel .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 3px 0; font-size: 12px; color: #91a9b8; }
    .panel .row label { white-space: nowrap; }
    input[type=range] { display: block; width: 100%; margin: 2px 0 10px; accent-color: #83d9e8; background: none; border: 0; padding: 0; }
    input[type=checkbox] { accent-color: #83d9e8; margin: 0; }
    .crosshair { position: absolute; left: 50%; top: 50%; width: 5px; height: 5px; margin: -2px; border: 1px solid #fff; border-radius: 50%; opacity: 0; }
    .crosshair.visible { opacity: .8; }
  </style>
  <script type="importmap">
  {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"}}
  </script>
</head>
<body>
  <div class="hud">
    <div class="brand"><strong>Liberty City</strong><span>Complete outdoor map · streamed from GTA IV</span></div>
    <div class="crosshair" id="crosshair"></div>
    <div class="hint">WASD move · mouse look · Shift sprint · Space up/jump · Q/C down · F fly/walk · Esc release mouse</div>
    <div class="panel">
      <div class="modes"><button class="active" data-mode="overview">Overview</button><button data-mode="fly">Fly</button><button data-mode="walk">Walk</button></div>
      <select id="sector-select" aria-label="Jump to sector"></select>
      <div><span>Mode</span><b id="mode">Overview</b></div><div><span>Loaded sectors</span><b id="sectors">0</b></div><div><span>Placements</span><b id="placements">—</b></div><div><span>Models</span><b id="models">—</b></div><div><span>Textures</span><b id="textures">0</b></div>
      <div class="sep">Timecycle · pc/data/timecyc.dat</div>
      <div class="row"><label for="hour">Time</label><b id="hour-label">12:00</b></div>
      <input type="range" id="hour" min="0" max="24" step="0.25" value="12" aria-label="Time of day">
      <div class="row"><label for="weather">Weather</label></div>
      <select id="weather" aria-label="Weather"></select>
      <div class="row"><label for="baked">Baked vertex AO</label><input type="checkbox" id="baked" checked></div>
      <div class="row"><label for="grade">Colour grade + bloom</label><input type="checkbox" id="grade" checked></div>
    </div>
    <div class="loading" id="loading"><h1>Loading Liberty City</h1><p id="status">Preparing geometry…</p><div class="track"><div class="bar" id="bar"></div></div></div>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
