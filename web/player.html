<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Niko · Character Preview</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    html, body, canvas { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #071018; color: #e9f2f7; }
    canvas { display: block; }
    .hud { position: fixed; inset: 0; pointer-events: none; }
    .brand { position: absolute; top: 26px; left: 30px; text-transform: uppercase; letter-spacing: .16em; text-shadow: 0 2px 18px #000; }
    .brand strong { display: block; font-size: 20px; letter-spacing: .08em; }
    .brand span { color: #8ba3b4; font-size: 11px; }
    .panel { position: absolute; right: 24px; bottom: 22px; min-width: 260px; padding: 14px 16px; border: 1px solid #ffffff20; background: #071018d9; box-shadow: 0 16px 48px #0008; pointer-events: auto; }
    .panel div { display: flex; justify-content: space-between; gap: 24px; padding: 3px 0; font-size: 12px; color: #91a9b8; }
    .panel b { color: #eef7fa; font-weight: 600; }
    select { width: 100%; margin-bottom: 10px; border: 1px solid #ffffff24; background: #ffffff0b; color: #dce8ee; padding: 7px 8px; font: inherit; cursor: pointer; color-scheme: dark; }
    .hint { position: absolute; left: 30px; bottom: 26px; color: #90a6b4; font-size: 11px; letter-spacing: .05em; text-shadow: 0 2px 8px #000; }
  </style>
  <script type="importmap">
  {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"}}
  </script>
</head>
<body>
  <div class="hud">
    <div class="brand"><strong>Niko Bellic</strong><span>playerped.rpf · move_player + jump_std</span></div>
    <div class="hint">Drag to orbit · scroll to zoom · pick a clip to play it</div>
    <div class="panel">
      <select id="clip" aria-label="Animation clip"></select>
      <div><span>Bones</span><b id="bones">—</b></div>
      <div><span>Vertices</span><b id="vertices">—</b></div>
      <div><span>Clips</span><b id="clips">—</b></div>
      <div><span>Height</span><b id="height">—</b></div>
    </div>
  </div>
  <script type="module" src="./player.js"></script>
</body>
</html>
